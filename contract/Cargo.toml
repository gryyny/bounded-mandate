[package]
name = "bounded-mandate"
description = "Bounded USDC/wNEAR trading mandate on NEAR Intents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
borsh.workspace = true
hex.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces.workspace = true
anyhow.workspace = true
tokio.workspace = true
rand.workspace = true
rand_chacha.workspace = true
ed25519-dalek = { workspace = true, features = ["std"] }
sha2.workspace = true
# Independent cross-check of our NEP-413 encoding with the pinned verifier's own crate (tests only).
defuse-core = { git = "https://github.com/near/intents", rev = "16d04f6ec4401263f8914638710260da50bb46b0" }

[lints]
workspace = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
