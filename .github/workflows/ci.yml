name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Fast checks only. The full gate (`make test`, `make demo`) runs locally from a fresh clone; its results are the
# committed evidence bundle, which the verify job checks.
jobs:
  # The judge's quick path plus lint and types: no Rust or cargo-near, only Node 24, the sandbox binary and Chromium.
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Headless Chromium and its system libraries
        run: cd tools && npm ci --no-audit --no-fund --ignore-scripts && npx --no-install playwright install --with-deps chromium
      - name: Lint and types
        run: cd tools && npm run lint && npm run typecheck
      - name: No Rust toolchain on the path
        run: |
          if command -v cargo || command -v rustc; then
            sudo rm -f "$(command -v cargo)" "$(command -v rustc)" "$(command -v rustup)"
            rm -rf "$HOME/.cargo/bin"
          fi
          ! command -v cargo && ! command -v rustc
      - name: make quick
        run: make quick
      - name: make example
        run: make example

  # The committed evidence bundle's internal consistency on the oldest supported Node, with no install.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: node verify.mjs
        run: node verify.mjs --no-checkout --rules bundle
