name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # An evidence-only commit changes no source: the verify job below checks its bundle against the checkout.
    if: ${{ !startsWith(github.event.head_commit.message, 'docs(evidence)') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The release secret scan reads the full history.
          fetch-depth: 0
      # The Rust target directory, cargo cache, sandboxes and Chromium exceed the runner's free disk; drop unused preinstalled SDKs.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-near
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: System packages for cargo-near
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
      - name: cargo-near
        run: command -v cargo-near || cargo install cargo-near --version 0.22.0 --locked
      - name: Headless Chromium and its system libraries for browser tests
        run: cd tools && npm ci --no-audit --no-fund --ignore-scripts && npx --no-install playwright install --with-deps chromium
      - name: make test
        run: make test
      - name: make demo
        run: make demo

  # The judge's quick path: no Rust or cargo-near, only Node 24, the sandbox binary and Chromium.
  quick:
    # An evidence-only commit changes no source: the verify job below checks its bundle against the checkout.
    if: ${{ !startsWith(github.event.head_commit.message, 'docs(evidence)') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Headless Chromium and its system libraries
        run: cd tools && npm ci --no-audit --no-fund --ignore-scripts && npx --no-install playwright install --with-deps chromium
      - name: No Rust toolchain on the path
        run: |
          if command -v cargo || command -v rustc; then
            sudo rm -f "$(command -v cargo)" "$(command -v rustc)" "$(command -v rustup)"
            rm -rf "$HOME/.cargo/bin"
          fi
          ! command -v cargo && ! command -v rustc
      - name: make quick
        run: make quick

  # The evidence check on the oldest supported Node, with no install. On an evidence commit the bundle is that of the
  # checked-out source, so the full checkout-bound check runs; on a source commit the newest bundle predates the
  # source, so only its internal consistency is checked.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: node verify.mjs
        env:
          EVIDENCE_COMMIT: ${{ startsWith(github.event.head_commit.message, 'docs(evidence)') }}
        run: |
          if [ "$EVIDENCE_COMMIT" = "true" ]; then node verify.mjs; else node verify.mjs --no-checkout --rules bundle; fi
