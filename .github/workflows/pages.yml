# GitHub Pages deployment for the certified evidence page, owner console, the two certified cuts and the
# presentation layer (overview and narrated pitch). Enabled on 14 November 2026 with the lead's approval.
# It runs only by hand (workflow_dispatch) with the certified revision; it has no push or schedule trigger.

name: pages

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Certified source revision whose evidence directory is served (evidence/<revision>/)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install tools (no lifecycle scripts)
        run: cd tools && npm ci --no-audit --no-fund --ignore-scripts
      - name: Assemble the site and check routes, links, assets and CSP on 127.0.0.1
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          case "$REVISION" in (*[!0-9a-f]*|'') echo "revision must be a hex commit id" >&2; exit 2;; esac
          dir="evidence/$REVISION"
          test -f "$dir/page/index.html"
          # The page links to the console, so the console of the same revision is required.
          test -f "$dir/console/index.html"
          console_args=(--console "$PWD/$dir/console")
          # Served cuts must equal the certified ones: their sha256 is checked against evidence/<rev>/video.json.
          # video/ holds exactly the two certified cuts the page links to; nothing else is served there.
          test -f "$dir/video.json"
          test "$(cd "$dir/video" && ls -A | sort | tr '\n' ' ')" = "bounded-mandate-demo.mp4 bounded-mandate-short.mp4 "
          console_args+=(--video "$PWD/$dir/video" --video-manifest "$PWD/$dir/video.json")
          # The presentation layer (overview and narrated pitch) is assembled with the certified files before any check;
          # each published file must equal the sha256 recorded in presentation/provenance.json.
          test -f presentation/provenance.json
          console_args+=(--presentation "$PWD/presentation")
          (cd tools && npx --no-install tsx src/release/main.ts site --page "$PWD/../$dir/page/index.html" "${console_args[@]}")
          # The bundle's own sums cover the served files (the cuts were committed before SHA256SUMS was written).
          for f in page/index.html console/index.html video/bounded-mandate-short.mp4 video/bounded-mandate-demo.mp4; do
            grep -Eq "^[0-9a-f]{64} [ *]$f\$" "$dir/SHA256SUMS" || { echo "$dir/SHA256SUMS does not list $f" >&2; exit 1; }
          done
          ( cd "$dir" && sha256sum --check --quiet SHA256SUMS )
          # Served bytes must equal the certified files.
          cmp "$dir/page/index.html" out/release/site/index.html
          diff -r "$dir/console" out/release/site/console
          diff -r "$dir/video" out/release/site/video
          ( cd presentation && python3 -c 'import json; [print(f"{h}  {p}") for p, h in json.load(open("provenance.json"))["files"].items()]' | sha256sum --check --quiet )
          for f in overview/index.html pitch/bounded-mandate-pitch.mp4 pitch/captions.vtt pitch/captions.srt pitch/poster.png; do cmp "presentation/$f" "out/release/site/$f"; done
          ( cd out/release/site && find . -type f ! -name .nojekyll -exec sha256sum {} + | sort -k2 ) | tee out/release/site-sha256.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/release/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
