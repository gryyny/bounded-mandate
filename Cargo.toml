[workspace]
members = ["contract"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/gryyny/bounded-mandate"
version = "0.1.0"

[workspace.dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
near-workspaces = { version = "=0.23.0", features = ["unstable"] }
anyhow = "1"
borsh = "1"
ed25519-dalek = { version = "2.2", default-features = false }
hex = "0.4"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(near)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
as_conversions = "deny"
arithmetic_side_effects = "deny"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
