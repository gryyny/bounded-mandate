[package]
name = "mock-mpc"
description = "TEST DOUBLE of the v1.signer MPC contract (near/mpc v3.17.0) with Ed25519 test keys; never deploy to a public network"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
serde_json.workspace = true
hex.workspace = true
ed25519-dalek = { workspace = true, features = ["fast"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces.workspace = true
anyhow.workspace = true
tokio.workspace = true
ed25519-dalek = { workspace = true, features = ["std"] }
sha2.workspace = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
